patchTask:
  handler: src/handlers/patchTask.patchTask
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:UpdateItem
          Resource:
            - !GetAtt TaskTable.Arn
  events:
    - httpApi:
        path: /tasks/{id}
        method: patch
        authorizer:
          name: cognitoAuthorizer
