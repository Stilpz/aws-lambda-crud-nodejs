# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: stivencardona
# "service" is the name of this project. This will also be added to your AWS resource names.
service: aws-lambda-crud-nodejs
frameworkVersion: "4"

# Values that differ by stage. "default" applies to every stage that is not listed, so staging, prod
# and any other name get the stricter values; dev opts out. alarmEmail is never committed: pass it
# at deploy time with --param="alarmEmail=<address>" (empty means no email subscription).
#
# Hardening (spec 0010): the default is strict, so a typo in a stage name is protected, and dev is
# the only stage that opts out. Protected stages keep their data when the stack is removed and refuse
# deletion; "serverless remove" fails there until protection is turned off in a reviewed change.
#   deletionPolicy      what CloudFormation does with the table and user pool when they leave the stack
#   tableProtection     deletion protection and point-in-time recovery on the table
#   userPoolProtection  ACTIVE blocks deleting the user pool
#   mfa                 OFF, or OPTIONAL (users may enrol an authenticator app)
#   authFlows           sign-in flows the app client allows; the admin flow is only for scripts/smoke.sh
#   throttleRate/Burst  requests per second and burst allowed on every route
#
# Origins that may call the API from a browser, one list per stage. A stage that is not listed
# (a personal stage in a fork) gets the local development origin only. Replace the example.com
# placeholders with the real frontend domains when they exist.
#
# Sign-in for the single-page app (spec 0015): the exact URLs the hosted sign-in may redirect to
# after login (spaCallbackUrls) and after logout (spaLogoutUrls). Cognito accepts https URLs, and
# http only for localhost, so only the default stage lists a local one.
stages:
  default:
    params:
      logRetentionInDays: 90
      logLevel: INFO
      alarmEmail: ""
      deletionPolicy: Retain
      tableProtection: true
      userPoolProtection: ACTIVE
      mfa: OPTIONAL
      authFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      throttleRate: 50
      throttleBurst: 100
      webOrigins:
        - http://localhost:5173
      spaCallbackUrls:
        - http://localhost:5173/auth/callback
      spaLogoutUrls:
        - http://localhost:5173/
  dev:
    params:
      logRetentionInDays: 7
      logLevel: DEBUG
      deletionPolicy: Delete
      tableProtection: false
      userPoolProtection: INACTIVE
      mfa: "OFF"
      authFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      throttleRate: 20
      throttleBurst: 40
  staging:
    params:
      webOrigins:
        - https://staging.app.example.com
      spaCallbackUrls:
        - https://staging.app.example.com/auth/callback
      spaLogoutUrls:
        - https://staging.app.example.com/
  prod:
    params:
      webOrigins:
        - https://app.example.com
      spaCallbackUrls:
        - https://app.example.com/auth/callback
      spaLogoutUrls:
        - https://app.example.com/

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: us-west-2
  tracing:
    lambda: true
  logRetentionInDays: ${param:logRetentionInDays}
  httpApi:
    cors:
      allowedOrigins: ${param:webOrigins}
      allowedHeaders:
        - Authorization
        - Content-Type
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      exposedResponseHeaders:
        - Deprecation
        - Sunset
      maxAge: 3600
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Join
          - ""
          - - "https://cognito-idp."
            - !Ref AWS::Region
            - ".amazonaws.com/"
            - !Ref UserPool
        # An ID token carries the app client id in aud and an access token in client_id; both are
        # matched against this list, so each client that signs users in must be listed.
        audience:
          - !Ref UserPoolClient
          - !Ref SpaUserPoolClient
  environment:
    TABLE_NAME: !Ref TaskTable
    STAGE: ${sls:stage}
    POWERTOOLS_SERVICE_NAME: ${self:service}
    POWERTOOLS_METRICS_NAMESPACE: TasksApi
    POWERTOOLS_LOG_LEVEL: ${param:logLevel}
  # No provider-level IAM statements: each function declares the one DynamoDB action it needs in its
  # own file, and a function without statements (hello) gets a role with logging permission only.

# Serverless puts everything in the service directory into the function packages unless a pattern
# excludes it. The generated client is for API consumers and never runs in a function.
package:
  patterns:
    - "!api-client/**"

functions:
  - ${file(./functions/hello.yml)}
  - ${file(./functions/createTask.yml)}
  - ${file(./functions/getTasks.yml)}
  - ${file(./functions/getTask.yml)}
  - ${file(./functions/updateTask.yml)}
  - ${file(./functions/patchTask.yml)}
  - ${file(./functions/deleteTask.yml)}

resources:
  - ${file(./resources/table.yml)}
  - ${file(./resources/api.yml)}
  - ${file(./resources/auth.yml)}
  - ${file(./resources/observability.yml)}
