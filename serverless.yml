# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: stivencardona
# "service" is the name of this project. This will also be added to your AWS resource names.
service: aws-lambda-crud-nodejs
frameworkVersion: "4"

# Origins that may call the API from a browser, one list per stage. A stage that is not listed
# (a personal stage in a fork) gets the local development origin only. Replace the example.com
# placeholders with the real frontend domains when they exist.
stages:
  default:
    params:
      webOrigins:
        - http://localhost:5173
  staging:
    params:
      webOrigins:
        - https://staging.app.example.com
  prod:
    params:
      webOrigins:
        - https://app.example.com

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: us-west-2
  httpApi:
    cors:
      allowedOrigins: ${param:webOrigins}
      allowedHeaders:
        - Authorization
        - Content-Type
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      exposedResponseHeaders:
        - Deprecation
        - Sunset
      maxAge: 3600
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Join
          - ""
          - - "https://cognito-idp."
            - !Ref AWS::Region
            - ".amazonaws.com/"
            - !Ref UserPool
        audience:
          - !Ref UserPoolClient
  environment:
    TABLE_NAME: !Ref TaskTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt TaskTable.Arn

functions:
  - ${file(./functions/hello.yml)}
  - ${file(./functions/createTask.yml)}
  - ${file(./functions/getTasks.yml)}
  - ${file(./functions/getTask.yml)}
  - ${file(./functions/updateTask.yml)}
  - ${file(./functions/patchTask.yml)}
  - ${file(./functions/deleteTask.yml)}

resources:
  - ${file(./resources/table.yml)}
  - ${file(./resources/auth.yml)}
