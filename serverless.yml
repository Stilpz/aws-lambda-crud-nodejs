# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: stivencardona
# "service" is the name of this project. This will also be added to your AWS resource names.
service: aws-lambda-crud-nodejs
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: us-west-2
  httpApi:
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Join
          - ""
          - - "https://cognito-idp."
            - !Ref AWS::Region
            - ".amazonaws.com/"
            - !Ref UserPool
        audience:
          - !Ref UserPoolClient
  environment:
    TABLE_NAME: !Ref TaskTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt TaskTable.Arn

functions:
  - ${file(./functions/hello.yml)}
  - ${file(./functions/createTask.yml)}
  - ${file(./functions/getTasks.yml)}
  - ${file(./functions/getTask.yml)}
  - ${file(./functions/updateTask.yml)}
  - ${file(./functions/deleteTask.yml)}

resources:
  - ${file(./resources/table.yml)}
  - ${file(./resources/auth.yml)}
