openapi: 3.0.3
info:
  title: Tasks API
  version: 1.2.0
  description: |
    Serverless REST API for managing personal tasks (AWS Lambda, API Gateway HTTP API,
    DynamoDB, Amazon Cognito).

    **Authentication.** Every operation except `GET /` needs a Cognito JWT in the
    `Authorization: Bearer <token>` header. API Gateway answers `401` before any function runs
    when the token is missing, invalid or expired. The token is an ID token or an access token
    issued by either app client of the user pool (the script client or the browser client); a
    browser app signs in with the authorization code flow and PKCE on the hosted sign-in and sends
    its access token.

    **Ownership.** Each task belongs to the user whose JWT `sub` claim created it. A user can only
    read, change or delete their own tasks. Asking for another user's task returns `404`,
    exactly like a task that does not exist.

    **Consistency.** `GET /tasks` and `GET /tasks/{id}` both use consistent reads: a task is
    readable and appears in the list as soon as it is created or updated.

    **CORS.** Browsers can call the API from the origins allowed for the stage (an explicit list,
    never a wildcard). API Gateway answers the preflight `OPTIONS` request itself, without a
    token; `Authorization` and `Content-Type` are the allowed request headers, and `Deprecation`
    and `Sunset` are exposed to scripts. Credentials (cookies) are not allowed.

    **Stability.** Changes follow the policy in `docs/API_VERSIONING.md` of the repository:
    breaking changes need a new major version and are announced and deprecated with
    `Deprecation` and `Sunset` headers, and `info.version` always equals the release tag.
    Pagination tokens (`nextToken`) are opaque and not guaranteed to be valid across
    deployments; when one is rejected with `400`, start the listing again. Task ids are opaque
    UUIDs.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    description: Deployed HTTP API (the base URL is printed by `serverless deploy`)
    variables:
      apiId:
        default: xxxxxxxxxx
      region:
        default: us-west-2
tags:
  - name: Health
    description: Public deployment check.
  - name: Tasks
    description: Task operations, scoped to the authenticated user.
paths:
  /:
    get:
      tags: [Health]
      operationId: hello
      summary: Health-check style greeting
      description: Public. Useful to verify a deployment.
      security: []
      responses:
        "200":
          description: Greeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Hello, World!
  /tasks:
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: |
        The server generates `id` (a time-sortable UUID, version 7) and `createdAt`, sets `ownerId` to the authenticated
        user and sets `done` to `false`. The request must use `Content-Type: application/json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
            example:
              title: Write docs
              description: Add a README
      responses:
        "201":
          description: The created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/MalformedJson"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List the caller's tasks
      description: |
        Returns one page of the authenticated user's tasks, oldest first. Keep requesting pages,
        passing back the previous `nextToken`, until `nextToken` is `null`. A page can be empty
        while a token is still returned. Tokens are opaque and only work for the user they were
        issued to.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, an integer from 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: nextToken
          in: query
          required: false
          description: The `nextToken` returned by the previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "400":
          description: "`limit` is not an integer from 1 to 100, or `nextToken` is invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: limit must be an integer between 1 and 100
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Could not retrieve tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Could not retrieve tasks
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get one task
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Could not retrieve task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Could not retrieve task
    patch:
      tags: [Tasks]
      operationId: patchTask
      summary: Partially update a task
      description: |
        Only the fields sent are changed, and at least one of `done`, `title` or `description` is
        required. Other fields (such as `id`, `ownerId` or `createdAt`) are ignored. Answers with the
        task as it is after the change. The request must use `Content-Type: application/json`.

        This is the replacement for the deprecated `PUT /tasks/{id}`, which accepts the same body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
            example:
              done: true
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/MalformedJson"
        "500":
          description: Could not update task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Could not update task
    put:
      tags: [Tasks]
      operationId: updateTask
      summary: Partially update a task (deprecated, use PATCH)
      deprecated: true
      description: |
        **Deprecated: use `PATCH /tasks/{id}`**, which accepts the same body and answers with the
        updated task instead of a message. This operation keeps working unchanged until the sunset
        date, 2027-04-03, and may be removed after it. Every response of this operation carries the
        `Deprecation`, `Sunset` and `Link` headers (responses produced by API Gateway itself, such as
        `401`, do not).

        Partial update despite the `PUT` verb: only the fields sent are changed, and at least one
        of `done`, `title` or `description` is required. Other fields (such as `id`, `ownerId`
        or `createdAt`) are ignored. The request must use `Content-Type: application/json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
            example:
              done: true
      responses:
        "200":
          description: Task updated
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Task updated successfully
        "400":
          description: The body failed validation
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example:
                message: Event object failed validation
                errors:
                  - "/body must have required property 'title'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The task does not exist or belongs to another user
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Task not found
        "415":
          description: "`Content-Type` is not `application/json`"
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Unsupported Media Type
        "422":
          description: The body is not valid JSON
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Invalid or malformed JSON was provided
        "500":
          description: Could not update task
          headers:
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Could not update task
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Task deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Could not delete task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Could not delete task
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT issued by the Cognito user pool of the deployment to one of its app clients. Both the
        ID token and the access token are accepted. Tokens of the script client expire after one
        hour; tokens of the browser client expire after 60 minutes and are renewed with a refresh
        token that lasts 7 days.
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Task id (a UUID).
      schema:
        type: string
        format: uuid
  headers:
    Deprecation:
      description: |
        When the operation was deprecated, as a structured-field date (RFC 9745): `@` followed by
        Unix seconds.
      schema:
        type: string
        example: "@1790985600"
    Sunset:
      description: |
        The HTTP-date (RFC 8594) after which the operation may be removed. It is at least 90 days
        after the release that deprecated it.
      schema:
        type: string
        example: Sat, 03 Apr 2027 00:00:00 GMT
    Link:
      description: |
        The migration notes of the deprecation: a URL with `rel="deprecation"` (RFC 9745). The
        replacement is `PATCH` on the same path.
      schema:
        type: string
        example: <https://github.com/Stilpz/aws-lambda-crud-nodejs/blob/main/CHANGELOG.md>; rel="deprecation"
  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: array
          description: One entry per failing field, as `<json pointer> <reason>`.
          items:
            type: string
    CreateTask:
      type: object
      required: [title]
      properties:
        title:
          type: string
          pattern: \S
          description: Non-empty string.
        description:
          type: string
          default: ""
    UpdateTask:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          pattern: \S
        description:
          type: string
        done:
          type: boolean
    Task:
      type: object
      required: [id, ownerId, title, description, createdAt, done]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          description: The `sub` claim of the owner's JWT. Set on creation, never changes.
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        done:
          type: boolean
      example:
        id: 0b9f5c1e-6c2a-4f0e-9d0b-2f1f3f0a7a11
        ownerId: b1c2d3e4-5f60-4a7b-8c9d-0e1f2a3b4c5d
        title: Write docs
        description: Add a README
        createdAt: "2026-09-29T15:04:05.000Z"
        done: false
    TaskPage:
      type: object
      required: [items, nextToken]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextToken:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or `null` when there are no more pages.
  responses:
    Unauthorized:
      description: Missing, invalid or expired token (answered by API Gateway)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: Unauthorized
    NotFound:
      description: The task does not exist or belongs to another user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: Task not found
    ValidationError:
      description: The body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            message: Event object failed validation
            errors:
              - "/body must have required property 'title'"
    UnsupportedMediaType:
      description: "`Content-Type` is not `application/json`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: Unsupported Media Type
    MalformedJson:
      description: The body is not valid JSON
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: Invalid or malformed JSON was provided
    ServerError:
      description: Unexpected failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
          example:
            message: Could not create task
