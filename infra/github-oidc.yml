AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets the GitHub Actions deploy workflow of this repository assume one deploy role per stage
  through OpenID Connect, with no long-lived AWS keys. Applied by hand by an administrator, once
  per stage, and never by the pipeline itself: the role it creates must not be able to change its
  own permissions. See specs/0008-add-deploy-pipeline-oidc.md and the README.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: >
      Stage this role deploys. It is also the name of the GitHub Environment whose jobs may
      assume the role.
  GitHubRepository:
    Type: String
    Default: Stilpz/aws-lambda-crud-nodejs
    Description: Repository allowed to assume the role, as owner/name.
  ServiceName:
    Type: String
    Default: aws-lambda-crud-nodejs
    Description: The service name in serverless.yml. Every resource the role may manage starts with it.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >
      "true" in exactly one stack of the account: an account can hold only one OpenID Connect
      provider for token.actions.githubusercontent.com. Leave "false" if the account already has
      one, or when another stage's stack created it.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-deploy-${ServiceName}-${Stage}
      Description: !Sub Deploys ${ServiceName} to the ${Stage} stage from GitHub Actions
      # The sub claim names the GitHub Environment, so the prod role can only be assumed by a job
      # that went through the prod environment, including its approval and branch restriction.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${Stage}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ServiceName}-${Stage}/*
              - Sid: CloudFormationValidation
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                Resource: "*"
              # Serverless Framework v4 keeps the packages in a shared deployment bucket it creates
              # itself; a per-stage bucket is covered too. Confirm the names on the first dev deploy.
              - Sid: DeploymentBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:PutBucketTagging
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::serverless-framework-deployments-${AWS::Region}-*
                  - !Sub arn:${AWS::Partition}:s3:::serverless-framework-deployments-${AWS::Region}-*/*
                  - !Sub arn:${AWS::Partition}:s3:::${ServiceName}-${Stage}-serverlessdeploymentbucket-*
                  - !Sub arn:${AWS::Partition}:s3:::${ServiceName}-${Stage}-serverlessdeploymentbucket-*/*
              - Sid: Functions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:ListVersionsByFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ServiceName}-${Stage}-*
              # No AttachRolePolicy on purpose: the Lambda role uses inline policies only, and the
              # ability to attach managed policies would let a deploy grant itself anything.
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-*
              - Sid: PassFunctionRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # API Gateway resource ARNs carry generated ids, so the scope is the region's HTTP APIs.
              - Sid: HttpApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
              # TaskTable-<stage> is the table spec 0006 replaced; the first deploy of a stage that
              # still has it deletes it. Drop that resource once every stage has deployed.
              - Sid: TaskTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Tasks-${Stage}
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/TaskTable-${Stage}
              # Cognito creates user pools with generated ids and CreateUserPool cannot be scoped.
              - Sid: UserPoolCreation
                Effect: Allow
                Action: cognito-idp:CreateUserPool
                Resource: "*"
              - Sid: UserPoolLifecycle
                Effect: Allow
                Action:
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:GetUserPoolMfaConfig
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  - cognito-idp:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              # Only scripts/smoke.sh needs these: it makes two throwaway users and deletes them.
              - Sid: SmokeTestUsers
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminDeleteUser
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              - Sid: FunctionLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ServiceName}-${Stage}-*
              - Sid: LogGroupListing
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: Value of the AWS_ROLE_ARN variable of the GitHub Environment named after the stage.
    Value: !GetAtt DeployRole.Arn
