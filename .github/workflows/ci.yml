name: CI

on:
  # development, staging and production run CI through deploy.yml, which deploys only if it passes.
  push:
    branches: [main]
  workflow_call:
  pull_request:
    branches: [development, staging, production, main]
  # New advisories appear without any change in the repository, so the audit also runs weekly.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  openapi-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:api

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:prod

  validate-template:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      SERVERLESS_VERSION: 4.43.0
      CFN_LINT_VERSION: 1.57.1
      # Secrets are not exposed to pull requests from forks; the steps below are skipped then.
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # print resolves serverless.yml without AWS credentials. Its resources section is a plain
      # CloudFormation fragment, which cfn-lint checks; functions and the Lambda role are generated
      # by the framework and are covered by the deploy itself.
      - name: Resolve serverless.yml
        if: env.SERVERLESS_ACCESS_KEY != ''
        run: npx --yes serverless@${SERVERLESS_VERSION} print --stage ci --format json > "$RUNNER_TEMP/serverless.json"
      - name: Extract the CloudFormation resources
        if: env.SERVERLESS_ACCESS_KEY != ''
        run: |
          node -e '
            const config = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const { Resources, Outputs, Conditions } = config.resources;
            // Some resources (the alarms) refer to resources the framework generates, the HTTP API
            // and the Lambda functions, which are not in this fragment. A placeholder with the
            // same logical id keeps cfn-lint from reporting the reference as unresolved.
            const referenced = new Set();
            const collect = (value) => {
              if (Array.isArray(value)) return value.forEach(collect);
              if (!value || typeof value !== "object") return;
              if (typeof value.Ref === "string") referenced.add(value.Ref);
              Object.values(value).forEach(collect);
            };
            collect({ Resources, Outputs });
            for (const id of referenced) {
              if (!id.startsWith("AWS::") && !(id in Resources)) {
                Resources[id] = { Type: "AWS::CloudFormation::WaitConditionHandle" };
              }
            }
            console.log(JSON.stringify({ AWSTemplateFormatVersion: "2010-09-09", Conditions, Resources, Outputs }));
          ' "$RUNNER_TEMP/serverless.json" > "$RUNNER_TEMP/resources.json"
      - name: Lint the CloudFormation resources
        if: env.SERVERLESS_ACCESS_KEY != ''
        run: |
          pip install "cfn-lint==${CFN_LINT_VERSION}"
          cfn-lint "$RUNNER_TEMP/resources.json"

  integration-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The image has no health check we can rely on, so wait until the port answers.
      - run: curl --silent --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://localhost:8000
      - run: npm run test:integration
